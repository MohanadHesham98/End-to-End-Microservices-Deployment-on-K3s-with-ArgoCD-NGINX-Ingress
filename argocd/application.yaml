apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smallsteps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/MohanadHesham98/End-to-End-Microservices-Deployment-on-K3s-with-ArgoCD-NGINX-Ingress.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: smallsteps

  # The HPA owns the backend replica count. Without this rule, self-healing
  # would reset replicas and fight the autoscaler.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
